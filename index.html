    <title>MovieJournal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..800&family=JetBrains+Mono:wght@400;600;700&family=Pacifico&family=Plus+Jakarta+Sans:wght@600;700;800&family=Yellowtail&display=swap" rel="stylesheet">
    <script>
      // Immediately unregister any stale Service Workers & Workbox caches that can cause a black screen
      (function () {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            }).catch(function () {});
          }
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              for (var j = 0; j < keys.length; j++) {
                caches.delete(keys[j]);
              }
            }).catch(function () {});
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-black text-white select-none">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
